<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="assets/js/theme-init.js"></script>
  <title>Rankings · Global Leader Approval Ratings</title>
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/fixes.css" />
  <link rel="stylesheet" href="assets/css/premium.css" />
  <link rel="stylesheet" href="assets/css/refine.css" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    .rank-hero { padding: calc(var(--nav-h) + 48px) 24px 32px; background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%); border-bottom: 1px solid var(--line); }
    .rank-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
    .rank-tabs a { padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--muted); background: var(--bg); border: 1px solid var(--line); text-decoration: none; }
    .rank-tabs a.is-active, .rank-tabs a:hover { color: var(--ink); background: var(--surface); border-color: var(--civic-blue); box-shadow: 0 0 0 3px var(--civic-blue-soft); }
  </style>
</head>
<body>
  <header class="site-header" id="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html"><span class="brand-mark"><span data-icon="globe"></span></span><span>Global Pulse</span></a>
      <button type="button" class="nav-toggle" data-nav-toggle aria-label="Menu">☰</button>
      <nav aria-label="Main navigation">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="leaders.html">Explore</a></li>
          <li><a href="map.html">World Map</a></li>
          <li><a href="rankings.html" class="is-active">Rankings</a></li>
          <li><a href="timeline.html">History</a></li>
          <li><a href="methodology.html">Methodology</a></li>
        </ul>
      </nav>
      <div class="header-actions"></div>
    </div>
  </header>

  <div class="rank-hero">
    <div class="section-inner">
      <p class="hero-eyebrow" style="color: var(--civic-blue); margin-bottom: 12px;">Trusted Rankings</p>
      <h1 data-rank-title style="font-family: var(--font-display); font-size: clamp(2rem, 4vw, 2.75rem); font-weight: 400; margin: 0 0 8px;">Global Support Rankings — Last 30 Days</h1>
      <p style="color: var(--muted); max-width: 52ch; margin: 0;">Wilson score sorting · Low sample sizes excluded from main ranking</p>
      <nav class="rank-tabs" data-rank-tabs aria-label="Ranking types">
        <a href="rankings.html?tab=support" data-tab="support">Support</a>
        <a href="rankings.html?tab=oppose" data-tab="oppose">Opposition</a>
        <a href="rankings.html?tab=hot" data-tab="hot">Today's Trending</a>
        <a href="rankings.html?tab=history" data-tab="history">Historical Figures</a>
        <a href="rankings.html?tab=controversy" data-tab="controversy">Most Controversial</a>
      </nav>
    </div>
  </div>

  <section class="section reveal" style="padding-top: 40px;">
    <div class="section-inner">
      <div class="ad-frame" style="margin-top:0;margin-bottom:20px;"><div data-ad-slot></div></div>
      <div class="leader-grid" data-rankings-grid></div>
    </div>
  </section>

  <footer data-site-footer></footer>

  <script src="assets/js/theme.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/map-data.js"></script>
  <script src="assets/js/world-map.js"></script>
  <script src="assets/js/pages.js"></script>
  <script src="assets/js/footer.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/pro.js"></script>
  <script src="assets/js/ads.js"></script>
</body>
</html>
